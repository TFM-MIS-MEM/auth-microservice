version: "3.8"

# ===========================================================
# Auth Microservice — Despliegue
#
# NINGUNO de los dos servicios publica puertos, y es deliberado. El capítulo 4
# de la memoria exige «que los microservicios sean accesibles únicamente a
# través de [la pasarela]», y esa frase es una propiedad de la topología, no del
# código: si el compose la contradice, no la sostiene nada.
#
# Por qué aquí NO se publica en el bucle local, y en desarrollo sí: en
# desarrollo el bucle local compra depuración directa y /docs desde el
# navegador —el primer `servers` del contrato—, y a cambio deja fuera al resto
# de la red. Aquí ese lado del intercambio no existe: nadie depura en
# producción y /docs se sirve por la pasarela. Queda solo el coste, y no es
# cero: 127.0.0.1 sigue siendo alcanzable por todo proceso y todo usuario del
# anfitrión, por cualquier contenedor con `network_mode: host`, y —según el
# reenvío que haya delante— por un `ssh -L`. Publicar en el bucle local no es
# «no publicar»: es «publicar a todo el anfitrión».
#
# Sin `ports`, ambos se alcanzan solo desde `auth-network`, que es lo que dice
# la memoria, y en Kubernetes se traduce a ClusterIP sin traducción.
# Véase TFM-MIS-MEM/docs#95.
# ===========================================================

services:
  mongodb:
    restart: unless-stopped
    image: mongo:latest
    container_name: auth-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - auth-network
    # SIN `ports`. Publicaba 27017 en 0.0.0.0: la colección `accounts` —correos,
    # hashes de contraseña y de API KEY— quedaba legible y ESCRIBIBLE desde la
    # red, sin pasar por el servicio ni por la pasarela. Solo la alcanza `auth`,
    # por la red del despliegue.
    volumes:
      - auth-mongo-data:/data/db

  auth:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      # `:?` en las que no admiten valor por omisión. La guarda equivalente ya
      # está en `src/config`, pero tiene que estar en las dos capas: un defecto
      # en el compose anula una guarda del código, porque ésta nunca llega a
      # ver la variable ausente.
      - MONGODB_URI=${MONGODB_URI:?obligatorio y sin defecto}
      - NODE_ENV=production
      - PORT=${PORT}
      - LOG_LEVEL=${LOG_LEVEL}
      # Faltaba, y sin él el servicio no puede firmar ni verificar un solo JWT.
      - JWT_SECRET=${JWT_SECRET:?obligatorio y sin defecto}
      # Sin `:?` a propósito: si no se declara, cae en el '1h' del código, que
      # tiene detrás la guarda de rango de `src/config/jwtExpiry.js`. Es un
      # defecto legítimo porque está validado, no asumido.
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      # Faltaba: producción venía metiendo enlaces a http://localhost:3000 en el
      # correo de recuperación de contraseña, sin registrar ningún fallo.
      - FRONTEND_URL=${FRONTEND_URL:?obligatorio y sin defecto}
      # Faltaba, y era el agujero de #95: sin esta variable el servicio arrancaba
      # con 'dev_internal_secret_key_789', el valor por defecto que traía el
      # código y que está publicado en este repositorio. Protege
      # POST /v1/auth/validate-key, que la pasarela declara inexistente.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?obligatorio y sin defecto}
    depends_on:
      - mongodb
    networks:
      - auth-network
    # SIN `ports`. Véase la cabecera del fichero.

volumes:
  auth-mongo-data:

networks:
  auth-network:
    driver: bridge
