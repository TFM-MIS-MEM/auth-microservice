# ===========================================================
# Auth Microservice — Entorno de Desarrollo Local
#
# Servicios: auth-service + auth-mongodb
# Red: tfm-network (externa, creada por scripts/dev-up.ps1)
#
# Uso independiente:
#   docker network create tfm-network   # solo la primera vez
#   docker compose -f docker-compose.dev.yml up --build
#
# Via script de orquestación:
#   ..\scripts\dev-up.ps1
# ===========================================================

version: "3.9"

services:

  # -----------------------------------------------------------
  # AUTH MICROSERVICE — Node.js + Express (modo desarrollo)
  # -----------------------------------------------------------
  auth:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      MONGODB_URI: mongodb://auth-mongodb:27017/auth-db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Sin defecto, y no por simetría con el código: un defecto AQUÍ anularía
      # la guarda de `src/config/internalSecret.js`, que no llegaría a
      # evaluarse nunca bajo compose. La guarda tiene que estar en las dos
      # capas o no está.
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET:?obligatorio y sin defecto. Genérelo con crypto.randomBytes(32).toString('hex') y déjelo igual en SPACE_AUTH_INTERNAL_SECRET de api-gateway}"
    ports:
      # Publicado SÓLO en el bucle local. Lo que quedaba expuesto aquí no son
      # las cabeceras de identidad —`auth` es el emisor del JWT y no las lee—,
      # sino POST /v1/auth/validate-key: `kong.yml` declara para esa ruta un
      # `request-termination` con 404 porque el contrato dice que no debe
      # exponerse a través de la pasarela, y con el puerto en 0.0.0.0 esa
      # terminación no protegía nada. Medido en #95: la operación respondía
      # desde la IP de LAN de la máquina.
      #
      # Atarlo a 127.0.0.1 deja fuera al resto de la red sin renunciar a la
      # depuración directa ni a /docs desde el navegador —el primer `servers`
      # de openapi/auth.yaml, que sigue siendo http://localhost:3000—.
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app:cached
      - /app/node_modules              # Preservar node_modules del contenedor
    networks:
      - tfm-network
    depends_on:
      auth-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3000}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -----------------------------------------------------------
  # AUTH DATABASE — MongoDB
  # -----------------------------------------------------------
  auth-mongodb:
    image: mongo:7.0
    container_name: auth-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: auth-db
    ports:
      # Publicado SÓLO en el bucle local, por el mismo motivo y con un agravante:
      # esta base NO tiene autenticación. En 0.0.0.0 cualquiera en la red leía la
      # colección `accounts` entera —correos, hashes de contraseña y de API KEY— y
      # podía escribir en ella, que es una vía a ADMIN sin pasar por el servicio.
      # Medido en #95.
      #
      # Atarlo a 127.0.0.1 cierra la red y conserva Compass. NO cierra el
      # anfitrión: cualquier proceso de esta máquina sigue leyendo la tabla de
      # cuentas. Eso exige autenticación en Mongo y se sigue en su propio issue.
      - "127.0.0.1:27017:27017"
    volumes:
      - auth-mongo-data:/data/db
    networks:
      - tfm-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# -----------------------------------------------------------
# VOLUMES
# -----------------------------------------------------------
volumes:
  auth-mongo-data:
    name: tfm_auth-mongo-data

# -----------------------------------------------------------
# NETWORKS — Externa (compartida entre microservicios)
# -----------------------------------------------------------
networks:
  tfm-network:
    external: true
    name: tfm-network
