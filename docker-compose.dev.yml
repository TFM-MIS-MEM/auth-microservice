version: "3.8"

services:
  mongodb:
    restart: unless-stopped
    image: mongo:latest
    container_name: auth-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - auth-network
    ports:
      - "27017:27017"
    volumes:
      - auth-mongo-data:/data/db

  auth:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: auth-service
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - NODE_ENV=development
      - PORT=${PORT}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - mongodb
    networks:
      - auth-network
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./:/app:cached
      - /app/node_modules

volumes:
  auth-mongo-data:

networks:
  auth-network:
    driver: bridge
